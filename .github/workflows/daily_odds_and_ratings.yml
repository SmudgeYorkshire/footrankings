name: Daily Odds Pull and Club Ratings

on:
  schedule:
    # 07:07 UTC every day (including weekends -- odds and matches happen
    # on weekends, unlike Opta's own Mon-Fri scrape cadence), off the hour
    # to avoid the top-of-hour scheduling crowd. Moved from 05:07 UTC
    # 2026-11-05 -- that ran too early to be ready by the time anyone
    # actually checked the site each morning, so it was being triggered
    # manually every day instead (confirmed as the real cause of the
    # ledger-duplication bug fixed the same day: the automatic and manual
    # runs both started from the same pre-run state, unaware of each
    # other). 07:07 UTC = 08:07 CET in winter (standard time, currently
    # active) -- GitHub Actions cron is fixed UTC with no DST awareness,
    # so this becomes 09:07 CEST once European clocks spring forward
    # (last Sunday of March); update this by -1 hour UTC then if an exact
    # 8 AM CET year-round matters more than a one-line comment.
    - cron: '7 7 * * *'
  workflow_dispatch:       # allow manual "Run workflow" trigger too

permissions:
  contents: write

jobs:
  odds-and-ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull today's odds from API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python fetch_daily_odds.py

      - name: Log today's API-Football coverage
        run: python odds_comparison_snapshot.py

      - name: Fit today's odds-driven club rating adjustments
        run: python club_rating_calibration.py

      - name: Update the persistent, full-history odds-implied club rating (experimental, not yet live)
        run: python club_odds_ratings.py

      - name: Rebuild the global Club Power Ranking (Opta/Odds/Combined Elo)
        run: python build_club_power_rankings.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add odds_coverage/ ratings/club_rating_adjustments.csv ratings/club_odds_implied_ratings.csv ratings/club_odds_processed_fixtures.csv club_power_rankings_1000.csv
          git diff --staged --quiet && exit 0
          git commit -m "Daily odds pull and club ratings $(date -u +%Y-%m-%d)"
          # main can move between this job's checkout and this push (another
          # workflow, or a manual commit) -- rebase onto the latest and retry
          # a few times rather than failing the whole run over a plain
          # non-fast-forward rejection.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt) -- rebasing onto latest main and retrying"
            git pull --rebase origin main
          done
          git push
