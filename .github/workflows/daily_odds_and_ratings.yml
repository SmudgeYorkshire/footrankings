name: Daily Odds Pull and Club Ratings

on:
  schedule:
    - cron: '7 5 * * *'   # 05:07 UTC every day (including weekends -- odds and
                           # matches happen on weekends, unlike Opta's own
                           # Mon-Fri scrape cadence), off the hour to avoid
                           # the top-of-hour scheduling crowd
  workflow_dispatch:       # allow manual "Run workflow" trigger too

permissions:
  contents: write

jobs:
  odds-and-ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull today's odds from API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python fetch_daily_odds.py

      - name: Log today's API-Football coverage
        run: python odds_comparison_snapshot.py

      - name: Fit today's odds-driven club rating adjustments
        run: python club_rating_calibration.py

      - name: Rebuild the global 0-1000 Club Power Ranking
        run: python build_club_power_rankings.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add odds_coverage/ ratings/club_rating_adjustments.csv club_power_rankings_1000.csv
          git diff --staged --quiet && exit 0
          git commit -m "Daily odds pull and club ratings $(date -u +%Y-%m-%d)"
          # main can move between this job's checkout and this push (another
          # workflow, or a manual commit) -- rebase onto the latest and retry
          # a few times rather than failing the whole run over a plain
          # non-fast-forward rejection.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt) -- rebasing onto latest main and retrying"
            git pull --rebase origin main
          done
          git push
