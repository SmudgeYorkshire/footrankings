name: Update Opta Ratings

on:
  schedule:
    - cron: '11 6 * * 1-5'  # 06:11 UTC, weekdays -- after Opta's own daily (Mon-Fri) refresh.
                             # Off the hour (not :00) to avoid GitHub's documented
                             # top-of-the-hour scheduled-workflow congestion, same
                             # reasoning daily_odds_and_ratings.yml's own ':07' already
                             # uses. A minor mitigation, not a guaranteed fix -- GitHub
                             # scheduled triggers are best-effort and can still run
                             # hours late, especially on public/free-tier repos.
  workflow_dispatch:        # allow manual "Run workflow" trigger too

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements-scraper.txt
          playwright install --with-deps chromium

      - name: Scrape the complete global Opta Power Rankings
        run: python scrape_opta_power_rankings.py

      - name: Update our 54 tracked leagues' ratings from the scrape
        run: python update_ratings_from_opta.py

      - name: Rebuild the global 0-1000 Club Power Ranking
        # Also runs at the end of daily_odds_and_ratings.yml -- whichever of
        # the two workflows runs LAST on a given day needs to be the one that
        # leaves club_power_rankings_1000.csv fresh. Without this, a normal
        # day (odds nominally 05:07 UTC, Opta 06:11 UTC) always built that
        # file from the PREVIOUS day's Opta numbers, since nothing re-ran it
        # after Opta's own refresh landed -- confirmed live 2026-10-13
        # (Coventry showing 89.0 here vs 89.5 on Opta's actual site right
        # after a manual Opta-only trigger). Pure local CSV processing, no
        # API calls, cheap enough to run from both workflows.
        run: python build_club_power_rankings.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opta_power_rankings.csv opta_power_rankings_meta.json ratings/ club_power_rankings_1000.csv
          git diff --staged --quiet && exit 0
          git commit -m "Update Opta ratings $(date -u +%Y-%m-%d)"
          # main can move between this job's checkout and this push (the odds
          # workflow, or a manual commit) -- rebase onto the latest and retry
          # a few times rather than failing the whole run over a plain
          # non-fast-forward rejection.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt) -- rebasing onto latest main and retrying"
            git pull --rebase origin main
          done
          git push
