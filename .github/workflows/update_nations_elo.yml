name: Update Nations League Elo Ratings

on:
  # No schedule trigger -- disabled 2026-11-13 at the user's request. The
  # daily auto-run's match-level L2 shrinkage was silently decaying manual
  # outright-odds corrections with nothing to re-anchor them (API-Football
  # has no NL outright market), which quietly undid a real fix (France's
  # win% drifting from ~19% back down to ~11% over 9 days with nothing in
  # the market actually having changed -- see nl_odds_calibration.py's own
  # OBSERVATIONS comment for the full incident). The user now runs this
  # manually each morning instead (Elo + odds + fresh outright-odds
  # screenshots), so the correction never gets silently overwritten
  # between visits. workflow_dispatch below still allows a manual "Run
  # workflow" trigger from the GitHub UI if ever needed.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-elo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch current Elo ratings from eloratings.net
        run: python scrape_elo_ratings.py

      - name: Fit today's odds-driven Nations League rating adjustments
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python nl_odds_calibration_auto.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ratings/nations_league_elo.csv ratings/nations_league_elo_adjustments.csv
          git diff --staged --quiet || git commit -m "Update Nations League Elo ratings $(date -u +%Y-%m-%d)"
          git push
