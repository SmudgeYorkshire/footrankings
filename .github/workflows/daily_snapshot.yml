name: Daily Probability Snapshot

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC ≈ 06:00-07:00 CET/CEST, every morning
  workflow_dispatch:        # allow manual "Run workflow" trigger too

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily snapshot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python daily_snapshot.py

      - name: Commit and push history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          git diff --staged --quiet || git commit -m "Daily probability snapshot $(date -u +%Y-%m-%d)"
          git push
