name: Daily Probability Snapshot

on:
  schedule:
    - cron: '15 9 * * *'  # 09:15 UTC = 10:15 CET / 11:15 CEST -- deliberately
                           # after the Daily Odds/Opta workflows' own
                           # 07:07/08:11 UTC schedule (moved later 2026-11-05,
                           # see those workflows' own comments for why), with
                           # a buffer past Opta's own 08:11 UTC start for that
                           # scrape to actually finish, so the snapshot
                           # captures the day's already-updated numbers,
                           # not yesterday's.
  workflow_dispatch:        # allow manual "Run workflow" trigger too

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily snapshot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python daily_snapshot.py

      - name: Commit and push history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          git diff --staged --quiet || git commit -m "Daily probability snapshot $(date -u +%Y-%m-%d)"
          git push
